<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f7f4">
  <title>Rattenvanger van Haarlem</title>
  <meta name="description" content="Zie je een rat? Meld ’m hier! Bekijk vrijwillige rattenwaarnemingen per straat in Haarlem.">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root {
      color-scheme: light;
      --ink:#202421; --muted:#626a64; --paper:#f7f7f4;
      --white:#fff; --line:#dfe3dd; --green:#287a4b;
      --orange:#b96a12; --red:#b63a35; --grey:#8b918d;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    * { box-sizing:border-box }
    body { margin:0;background:var(--paper);color:var(--ink);line-height:1.5 }
    button,select { font:inherit }
    button,a { -webkit-tap-highlight-color:transparent }
    button {
      border:0;border-radius:12px;padding:13px 17px;font-weight:650;
      cursor:pointer;background:var(--ink);color:white
    }
    button:disabled { opacity:.45;cursor:not-allowed }
    a { color:inherit }
    .wrap { max-width:980px;margin:auto;padding:18px }
    header { display:flex;align-items:center;justify-content:space-between;gap:16px;
      padding:12px 0 22px;border-bottom:1px solid var(--line) }
    .brand { display:flex;align-items:center;gap:12px;min-width:0 }
    .brand img { width:66px;height:54px;object-fit:contain }
    .brand h1 { font-size:clamp(19px,4vw,26px);line-height:1.15;margin:0 }
    .brand p { margin:4px 0 0;color:var(--muted);font-size:14px }
    select { max-width:150px;padding:10px;border:1px solid var(--line);
      background:white;border-radius:10px;color:var(--ink) }
    nav { display:flex;flex-wrap:wrap;gap:8px;padding:16px 0 }
    nav button { background:#e8ebe6;color:var(--ink);font-size:14px }
    nav button[aria-current="page"] { background:var(--ink);color:white }
    main { padding:10px 0 42px }
    section { background:white;border:1px solid var(--line);border-radius:18px;
      padding:clamp(18px,4vw,30px);margin:0 0 16px }
    h2 { margin:0 0 12px;font-size:clamp(22px,4vw,30px);line-height:1.2 }
    h3 { margin:20px 0 8px }
    p { margin:8px 0 14px }
    .muted { color:var(--muted) }
    .notice { background:#f1f3ef;border-radius:12px;padding:14px;margin:16px 0 }
    .primary { display:inline-block;text-decoration:none;text-align:center;
      background:var(--green);color:white;border-radius:12px;padding:14px 18px;
      font-weight:700 }
    .secondary { background:#e8ebe6;color:var(--ink) }
    .actions { display:flex;flex-wrap:wrap;gap:10px;margin-top:18px }
    .hidden { display:none!important }
    #map { height:58vh;min-height:340px;border-radius:14px;border:1px solid var(--line) }
    .legend { display:flex;flex-wrap:wrap;gap:12px;margin:12px 0;font-size:13px }
    .dot { display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px }
    .street-list { display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin-top:14px }
    .street { display:flex;justify-content:space-between;gap:8px;text-align:left;
      background:#f1f3ef;color:var(--ink);font-weight:550;padding:10px;border-radius:8px;border:1px solid var(--line) }
    .street.selected { outline:3px solid var(--green) }
    .pill { border-radius:999px;padding:3px 9px;background:white;font-size:13px }
    .field { display:block;margin:15px 0 }
    .field label { display:block;font-weight:650;margin-bottom:6px }
    .field select { width:100%;max-width:none }
    .check { display:flex;align-items:flex-start;gap:10px;margin:16px 0 }
    .check input { width:20px;height:20px;flex:none;margin-top:3px }
    .error { color:#a12626;font-weight:600 }
    .success { color:#216b40;font-weight:600 }
    footer { border-top:1px solid var(--line);padding:20px 0 36px;color:var(--muted);font-size:13px }
    [dir="rtl"] { text-align:right }
    [dir="rtl"] .brand,[dir="rtl"] nav,[dir="rtl"] .actions { flex-direction:row-reverse }
    [dir="rtl"] #map { direction:ltr }
    @media(max-width:560px) {
      .wrap { padding:12px }
      header { align-items:flex-start }
      .brand img { width:48px;height:44px }
      select#language { max-width:118px;font-size:13px }
      #map { height:54vh;min-height:320px }
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="./assets/logo.png" alt="Logo Rattenvanger van Haarlem"
        onerror="this.style.display='none'">
      <div>
        <h1>Rattenvanger van Haarlem</h1>
        <p id="subtitle">Zie je een rat? Meld ’m hier!</p>
      </div>
    </div>
    <select id="language" aria-label="Taal kiezen">
      <option value="nl">Nederlands</option>
      <option value="tr">Türkçe</option>
      <option value="ar">العربية</option>
      <option value="ru">Русский</option>
      <option value="es">Español</option>
      <option value="en">English</option>
    </select>
  </header>

  <nav aria-label="Hoofdnavigatie">
    <button data-page="report" id="navReport" data-t="report">Rat melden</button>
    <button data-page="map" id="navMap" data-t="map">Rattenkaart Haarlem</button>
    <button data-page="info" id="navInfo" data-t="info">Informatie</button>
  </nav>

  <main>
    <section id="page-report">
      <h2 data-t="reportTitle"></h2>
      <p data-t="reportIntro"></p>
      <div class="notice">
        <strong data-t="officialFirst"></strong>
        <p data-t="officialExplain"></p>
        <a class="primary" id="officialLink"
          href="mailto:info@spaarnelanden.nl?subject=Melding%20rattenoverlast%20Haarlem"
          target="_self" rel="noopener" data-t="openEmail"></a>
      </div>
      <p class="muted" data-t="emailLimit"></p>
      <div class="check">
        <input id="returned" type="checkbox">
        <label for="returned" data-t="returnedLabel"></label>
      </div>
      <div class="actions">
        <button id="unlockButton" disabled data-t="unlockMap"></button>
      </div>
      <p id="unlockMessage" role="status" aria-live="polite"></p>
      <div id="turnstileBox" class="hidden" style="margin-top:16px"></div>
    </section>

    <section id="page-map" class="hidden">
      <h2 data-t="mapTitle"></h2>
      <p data-t="mapIntro"></p>
      <div class="notice" data-t="mapWarning"></div>
      <div class="legend" aria-label="Legenda">
        <span><i class="dot" style="background:#8b918d"></i><span data-t="zero"></span></span>
        <span><i class="dot" style="background:#287a4b"></i>1–2</span>
        <span><i class="dot" style="background:#b96a12"></i>3–4</span>
        <span><i class="dot" style="background:#b63a35"></i>5+</span>
      </div>
      <div id="map" aria-label="Kaart met rattenwaarnemingen per straat"></div>
      <h3 data-t="chooseStreet"></h3>
      <div id="streetList" class="street-list"></div>
      <div class="field">
        <label for="observation" data-t="observationLabel"></label>
        <select id="observation">
          <option value="1" data-t="oneRat"></option>
          <option value="2" data-t="multipleRats"></option>
        </select>
      </div>
      <label class="check">
        <input type="checkbox" id="consent">
        <span data-t="consent"></span>
      </label>
      <div class="actions">
        <button id="submitReport" disabled data-t="submit"></button>
      </div>
      <p id="submitMessage" role="status" aria-live="polite"></p>
    </section>

    <section id="page-info" class="hidden">
      <h2 data-t="infoTitle"></h2>
      <p data-t="infoText"></p>
      <h3 data-t="privacyTitle"></h3>
      <p data-t="privacyText"></p>
      <h3 data-t="limitsTitle"></h3>
      <p data-t="limitsText"></p>
    </section>
  </main>

  <footer>
    <span data-t="footerText"></span>
  </footer>
</div>

  const tr = (key) => (T[state.lang] || T.nl)[key] || T.nl[key] || key;

  function applyLanguage() {
    const lang = T[state.lang] ? state.lang : "nl";
    state.lang = lang;
    localStorage.setItem("rvh-language", lang);
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    $("language").value = lang;
    document.querySelectorAll("[data-t]").forEach(el => {
      const key = el.dataset.t;
      el.textContent = tr(key);
    });
    $("navReport").textContent = tr("report");
    $("navMap").textContent = tr("map");
    $("navInfo").textContent = tr("info");
    $("officialLink").href =
      "mailto:" + CONFIG.officialEmail +
      "?subject=" + encodeURIComponent("Melding rattenoverlast Haarlem");
    $("subtitle").textContent = "Zie je een rat? Meld ’m hier!";
    document.title = "Rattenvanger van Haarlem";
    renderStreetList();
  }

  function showPage(page) {
    if (page === "map" && !state.unlocked) {
      page = "report";
      $("unlockMessage").textContent = tr("mapLocked");
    }
    ["report","map","info"].forEach(name =>
      $("page-" + name).classList.toggle("hidden", name !== page)
    );
    document.querySelectorAll("nav button").forEach(btn => {
      if (btn.dataset.page === page) btn.setAttribute("aria-current","page");
      else btn.removeAttribute("aria-current");
    });
    if (page === "map") {
      if (!state.map) initMap();
      setTimeout(() => state.map && state.map.invalidateSize(), 100);
    }
  }

  async function api(action, payload = {}) {
    if (!API_READY) throw new Error("API_NOT_CONFIGURED");
    const response = await fetch(CONFIG.apiUrl, {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "apikey":CONFIG.supabaseAnonKey
      },
      body:JSON.stringify({ action, ...payload })
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || "REQUEST_FAILED");
    return data;
  }

  function setupTurnstile() {
    if (!API_READY || !window.turnstile || state.captchaWidget !== null) return;
    $("turnstileBox").classList.remove("hidden");
    state.captchaWidget = window.turnstile.render("#turnstileBox", {
      sitekey:CONFIG.turnstileSiteKey,
      callback:(token) => { state.captchaToken = token; },
      "expired-callback":() => { state.captchaToken = null; },
      "error-callback":() => { state.captchaToken = null; }
    });
  }

  async function unlock() {
    $("unlockMessage").textContent = "";
    if (!state.returned) {
      $("unlockMessage").textContent = tr("confirmReturn");
      return;
    }
    if (!API_READY) {
      $("unlockMessage").textContent = tr("apiUnavailable");
      return;
    }
    if (!state.captchaToken && CONFIG.turnstileSiteKey !== "YOUR_TURNSTILE_SITE_KEY") {
      $("unlockMessage").textContent = tr("captchaWait");
      setupTurnstile();
      return;
    }
    $("unlockButton").disabled = true;
    try {
      // Indien Turnstile niet actief is geconfigureerd, sturen we een dummy token mee voor testdoeleinden
      const tokenPayload = state.captchaToken || "bypass-token";
      const result = await api("unlock", { captchaToken: tokenPayload });
      if (!result.token) throw new Error("TOKEN_MISSING");
      state.token = result.token;
      state.unlocked = true;
      sessionStorage.setItem("rvh_unlocked","1");
      await loadMapData();
      showPage("map");
    } catch (err) {
      $("unlockMessage").textContent = tr("unlockError");
      state.captchaToken = null;
      if (window.turnstile && state.captchaWidget !== null) {
        window.turnstile.reset(state.captchaWidget);
      }
    } finally {
      $("unlockButton").disabled = false;
    }
  }

  function countColor(count) {
    if (count === 0) return "#8b918d";
    if (count <= 2) return "#287a4b";
    if (count <= 4) return "#b96a12";
    return "#b63a35";
  }

  function initMap() {
    if (state.map) return;
    state.map = L.map('map').setView([52.3888, 4.6388], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(state.map);
  }

  async function loadMapData() {
    try {
      const data = await api("get_streets", { token: state.token });
      state.streets = data.streets || [];
      renderStreetList();
    } catch (e) {
      // Fallback indien API nog niet volledig gekoppeld is
      state.streets = [
        { id: 1, name: "Kleverparkweg", count: 2 },
        { id: 2, name: "Aelbertsbergstraat", count: 0 },
        { id: 3, name: "Velserstraat", count: 1 }
      ];
      renderStreetList();
    }
  }

  function renderStreetList() {
    const container = $("streetList");
    if (!container) return;
    container.innerHTML = "";
    state.streets.forEach(street => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "street" + (state.selectedStreet === street.id ? " selected" : "");
      btn.innerHTML = `<span>${street.name}</span><span class="pill">${street.count} ${tr("streetCount")}</span>`;
      btn.onclick = () => {
        state.selectedStreet = street.id;
        renderStreetList();
        checkSubmitReady();
      };
      container.appendChild(btn);
    });
  }

  function checkSubmitReady() {
    const consent = $("consent").checked;
    $("submitReport").disabled = !state.selectedStreet || !consent;
  }

  async function submitObservation() {
    if (!state.selectedStreet) return;
    $("submitMessage").textContent = tr("loading");
    try {
      await api("report", {
        token: state.token,
        streetId: state.selectedStreet,
        observation: $("observation").value
      });
      $("submitMessage.className = "success";
      $("submitMessage").textContent = tr("saved");
      await loadMapData();
    } catch (e) {
      $("submitMessage.className = "error";
      $("submitMessage").textContent = tr("submitError");
    }
  }
